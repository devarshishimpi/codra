name: Trigger Docs Deploy

on:
  push:
    branches:
      - dev
    paths:
      - "docs/**"

jobs:
  trigger:
    name: Trigger codra-web deployment
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to codra-web
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODRA_WEB_DISPATCH_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'devarshishimpi',
              repo: 'codra-web',
              event_type: 'docs-updated',
              client_payload: {
                sha: context.sha,
                ref: context.ref
              }
            });
